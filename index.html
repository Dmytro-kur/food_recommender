<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="Кишеньковий помічник для дешевого меню, швидких рецептів і розумного списку покупок."
    />
    <meta name="theme-color" content="#f7f5ee" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Крихта — меню та покупки</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <button class="brand" type="button" data-view-link="home" aria-label="На головну">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 32 32">
              <path d="M9 9.5C9 5.9 12 3 15.7 3h.6C20 3 23 5.9 23 9.5v1.1H9V9.5Z" />
              <path d="M7 11h18l-1.7 15.2A2 2 0 0 1 21.3 28H10.7a2 2 0 0 1-2-1.8L7 11Z" />
              <path d="M12 15.5v7M16 15.5v7M20 15.5v7" />
            </svg>
          </span>
          <span>Крихта</span>
        </button>
        <button class="icon-button account-button" id="accountButton" type="button" aria-label="Обліковий запис">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="8" r="4" />
            <path d="M4 21a8 8 0 0 1 16 0" />
          </svg>
        </button>
      </header>

      <main id="app" class="main-content" tabindex="-1">
        <div class="app-loading" role="status">
          <span></span>
          <strong>Відкриваю локальну базу…</strong>
        </div>
      </main>

      <nav class="bottom-nav" aria-label="Головна навігація">
        <button class="nav-item active" type="button" data-view="home">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="m3 11 9-8 9 8v9a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1v-9Z" />
          </svg>
          <span>Сьогодні</span>
        </button>
        <button class="nav-item" type="button" data-view="menu">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="3" y="5" width="18" height="16" rx="2" />
            <path d="M16 3v4M8 3v4M3 10h18M8 14h.01M12 14h.01M16 14h.01M8 18h.01M12 18h.01" />
          </svg>
          <span>Меню</span>
        </button>
        <button class="nav-item nav-shopping" type="button" data-view="shopping">
          <span id="shoppingBadge" class="nav-badge">0</span>
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="9" cy="20" r="1" />
            <circle cx="19" cy="20" r="1" />
            <path d="M3 4h2l2.4 11.2a2 2 0 0 0 2 1.6h7.8a2 2 0 0 0 2-1.6L21 8H6" />
          </svg>
          <span>Покупки</span>
        </button>
        <button class="nav-item" type="button" data-view="pantry">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 8h16v12a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V8ZM3 4h18v4H3zM10 12h4" />
          </svg>
          <span>Запаси</span>
        </button>
      </nav>
    </div>

    <div class="modal-backdrop" id="modalBackdrop" hidden>
      <section class="modal-sheet" id="modalSheet" role="dialog" aria-modal="true" aria-labelledby="modalTitle"></section>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script type="module" src="./app.js"></script>
  </body>
</html>
