<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="Кулінарна книга з рецептами, запасами інгредієнтів і сімейними заявками на продукти."
    />
    <meta name="theme-color" content="#f7f5ee" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Крихта — рецепти та заявки</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <button class="brand" type="button" data-view-link="recipes" aria-label="До рецептів">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 32 32">
              <path d="M9 9.5C9 5.9 12 3 15.7 3h.6C20 3 23 5.9 23 9.5v1.1H9V9.5Z" />
              <path d="M7 11h18l-1.7 15.2A2 2 0 0 1 21.3 28H10.7a2 2 0 0 1-2-1.8L7 11Z" />
              <path d="M12 15.5v7M16 15.5v7M20 15.5v7" />
            </svg>
          </span>
          <span>Крихта</span>
        </button>
        <button class="icon-button account-button" id="accountButton" type="button" aria-label="Обліковий запис">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="8" r="4" />
            <path d="M4 21a8 8 0 0 1 16 0" />
          </svg>
        </button>
      </header>

      <main id="app" class="main-content" tabindex="-1">
        <div class="app-loading" role="status">
          <span></span>
          <strong>Відкриваю локальну базу…</strong>
        </div>
      </main>

      <nav class="bottom-nav" aria-label="Головна навігація">
        <button class="nav-item active" type="button" data-view="recipes">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M5 4h14a2 2 0 0 1 2 2v13H3V6a2 2 0 0 1 2-2Z" />
            <path d="M7 8h10M7 12h10M7 16h6" />
          </svg>
          <span>Рецепти</span>
        </button>
        <button class="nav-item nav-shopping" type="button" data-view="requests">
          <span id="requestsBadge" class="nav-badge" hidden>0</span>
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M6 4h12a2 2 0 0 1 2 2v12l-4-3-4 3-4-3-4 3V6a2 2 0 0 1 2-2Z" />
            <path d="M8 8h8M8 12h6" />
          </svg>
          <span>Заявки</span>
        </button>
        <button class="nav-item" type="button" data-view="pantry">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 8h16v12a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V8ZM3 4h18v4H3zM10 12h4" />
          </svg>
          <span>Інгредієнти</span>
        </button>
      </nav>
    </div>

    <div class="modal-backdrop" id="modalBackdrop" hidden>
      <section class="modal-sheet" id="modalSheet" role="dialog" aria-modal="true" aria-labelledby="modalTitle"></section>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script type="module" src="./app.js"></script>
  </body>
</html>
